# Deploy de referência na VPS do lab (ou em qualquer host com Traefik e
# Postgres já rodando). Reaproveita a rede do Traefik existente em vez de
# duplicar proxy reverso e certificado — mesmo padrão usado no deploy do
# OmniData (ver docs/deploy-vps.md daquele repositório).
#
# Uso:
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
#
# Pré-requisitos no host: uma rede externa do Traefik (ajuste o nome abaixo)
# e um Postgres acessível via DATABASE_URL — pode ser o Postgres compartilhado
# do lab, com um banco/role dedicado para este projeto.

services:
  api:
    build:
      context: ..
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      APPROVAL_WEBHOOK_URL: ${APPROVAL_WEBHOOK_URL}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ukode-core-api.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.ukode-core-api.entrypoints=websecure"
      - "traefik.http.routers.ukode-core-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.ukode-core-api.loadbalancer.server.port=8000"

  worker:
    build:
      context: ..
      target: worker
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      APPROVAL_WEBHOOK_URL: ${APPROVAL_WEBHOOK_URL}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
    networks:
      - traefik

networks:
  traefik:
    external: true
